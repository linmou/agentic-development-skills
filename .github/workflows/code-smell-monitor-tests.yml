name: Code Smell Monitor Runtime Tests
on:
  pull_request:
    paths:
      - 'skills/code-smell-monitor/**'
      - '.github/workflows/code-smell-monitor-tests.yml'
  push:
    branches: [main]
    paths:
      - 'skills/code-smell-monitor/**'
      - '.github/workflows/code-smell-monitor-tests.yml'
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Offline runtime regression tests
        run: python -m unittest discover -s skills/code-smell-monitor/tests -v
      - name: Compile script
        run: python -m py_compile skills/code-smell-monitor/scripts/code_smell_monitor.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install TypeScript compiler API for AST regression tests
        run: npm install --no-save --prefix "$RUNNER_TEMP/csm-tools" typescript@5.9.3
      - name: Behavioral redundancy analyzer tests
        env:
          NODE_PATH: ${{ runner.temp }}/csm-tools/node_modules
        run: node --test skills/code-smell-monitor/tests/test_behavioral_redundancy.cjs
      - name: Syntax-check behavioral redundancy analyzer
        run: node --check skills/code-smell-monitor/scripts/behavioral_redundancy.cjs

      # TEMPORARY integration smoke test against a public repository; remove after recording results.
      - name: Checkout temporary integration target
        uses: actions/checkout@v4
        with:
          repository: linmou/PhishingTrainingProgram
          ref: no_sign_up
          path: target-repo
          persist-credentials: false
      - name: Scan actual integration target for redundant execution
        env:
          NODE_PATH: ${{ runner.temp }}/csm-tools/node_modules
        run: |
          node skills/code-smell-monitor/scripts/behavioral_redundancy.cjs --repo target-repo/tutor-system --out integration-results.json
          python - <<'PY'
          import json
          from collections import Counter
          p=json.load(open("integration-results.json"))
          print("ACTUAL_REPO_INTEGRATION_START")
          print(json.dumps({"status":p.get("status"),"scanned_files":p.get("scanned_files"),"omissions":p.get("omissions"),"types":dict(Counter(f["type"] for f in p.get("findings",[]))),"findings":p.get("findings",[])[:70]}, indent=2))
          print("ACTUAL_REPO_INTEGRATION_END")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: actual-repo-behavioral-scan-temporary
          path: integration-results.json
